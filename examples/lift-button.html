<!doctype html><html lang="en"><meta charset="utf-8"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f0ede6;font-family:system-ui}.lift-button{border:0;border-radius:99px;background:#262820;color:#fff;padding:18px 28px;font:500 14px system-ui;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}.lift-button:hover{transform:translateY(-5px);box-shadow:0 12px 22px #26282025}.lift-button:active{transform:translateY(-1px)}.lift-button:focus-visible{outline:3px solid #9b6630;outline-offset:5px}@media(prefers-reduced-motion:reduce){.lift-button{transition:none}}</style><button class="lift-button" onclick="this.textContent=this.textContent==='Take a little leap ↗'?'A little higher ✓':'Take a little leap ↗'">Take a little leap ↗</button></html>
