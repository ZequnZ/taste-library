<!doctype html><html lang="en"><meta charset="utf-8"><style>body{margin:0;min-height:100vh;background:#eeeee7;display:grid;place-items:center;font:12px monospace}.palette{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;padding:24px}button{width:47px;height:100px;border:0;border-radius:40px;cursor:pointer;transition:transform .3s}button:hover{transform:translateY(-8px)}button:focus-visible{outline:2px solid #222;outline-offset:3px}output{display:block;text-align:center;margin-top:15px;color:#313728}</style><section><div class="palette"><button style="background:#e1e6d6" aria-label="#e1e6d6" onclick="document.querySelector('output').textContent=this.getAttribute('aria-label')"></button><button style="background:#b8c4a5" aria-label="#b8c4a5" onclick="document.querySelector('output').textContent=this.getAttribute('aria-label')"></button><button style="background:#8c9b73" aria-label="#8c9b73" onclick="document.querySelector('output').textContent=this.getAttribute('aria-label')"></button><button style="background:#5e704d" aria-label="#5e704d" onclick="document.querySelector('output').textContent=this.getAttribute('aria-label')"></button><button style="background:#34442d" aria-label="#34442d" onclick="document.querySelector('output').textContent=this.getAttribute('aria-label')"></button></div><output>Choose a tone</output></section></html>
