<!doctype html><html lang="en"><meta charset="utf-8"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9e6f1;font-family:system-ui}.orbit-toggle{width:90px;height:46px;border:1px solid #64577370;border-radius:99px;padding:5px;background:#d2c9e1;cursor:pointer}.moon{display:block;width:34px;height:34px;border-radius:50%;background:#62526f;transition:transform .5s cubic-bezier(.34,1.3,.64,1),background .5s}.orbit-toggle[aria-pressed=true] .moon{transform:translateX(44px) rotate(180deg);background:#faf6ff}.orbit-toggle:focus-visible{outline:3px solid #62526f;outline-offset:5px}@media(prefers-reduced-motion:reduce){.moon{transition:none}}</style><button class="orbit-toggle" aria-label="Night mode" aria-pressed="false" onclick="this.setAttribute('aria-pressed',this.getAttribute('aria-pressed')!=='true')"><span class="moon"></span></button></html>
