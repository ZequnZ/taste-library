*{box-sizing:border-box}
:root{color-scheme:light;--bg:oklch(0.985 0.003 106);--fg:oklch(0.27 0.02 57);--muted:#827971;--line:#b6a89a70;--accent:#b88343;--paper:#fff;--spring:cubic-bezier(.22,1.5,.5,1)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body.dark{color-scheme:dark;--bg:oklch(0.15 0.014 63);--fg:oklch(0.97 0.003 106);--muted:#b9aca0;--line:#c7b29b55;--accent:#d4a96a;--paper:#27231f}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:transparent;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:5px}
.lab{width:min(880px,100%);margin:auto;padding:26px 28px 40px}
.lab-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.eyebrow{font:500 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font:500 25px/1.2 Georgia,serif;letter-spacing:-.03em;margin:4px 0 0}
.theme{width:44px;height:44px;flex:0 0 auto;border:1px solid var(--line);border-radius:50%;font-size:19px}
.lede{margin:20px 0 28px;color:var(--muted);font-size:13px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.variant{position:relative;min-width:0;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);transition:border-color .2s}
.variant:hover,.variant:focus-within{border-color:var(--accent)}
.variant.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.variant-select{display:block;width:100%;text-align:left;cursor:pointer}
.stage{position:relative;display:grid;place-items:center;height:110px;border-bottom:1px dashed var(--line)}
.stage .idea-link{pointer-events:none}
.replay{position:absolute;right:10px;top:10px;z-index:2;display:grid;place-items:center;width:44px;height:44px;color:var(--muted);font:21px/1 sans-serif;border-radius:50%}
.replay:hover{color:var(--accent);background:var(--bg)}
.variant-copy{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}
.variant-name{font:600 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace}
.variant-number{color:var(--muted);font:10px ui-monospace,monospace}
.note{display:block;font-size:12px;line-height:1.6;color:var(--muted);margin:6px 0 0}
.status{margin:24px 0 0;min-height:24px;font:12px ui-monospace,monospace;color:var(--muted)}
.status strong{color:var(--accent);font-weight:500}
.idea-link{position:relative;display:inline-block;padding:2px 4px;margin:-2px -4px}
.idea-word{display:inline-block;white-space:nowrap;font:600 36px/1 Fredoka,sans-serif;font-feature-settings:"dlig" 0,"liga" 0,"calt" 0;transition:transform .55s var(--spring),color .3s}
.idea-link.active .idea-word{color:var(--accent)}
.letter{display:inline-block;transform-origin:50% 100%;font-feature-settings:"dlig" 0,"liga" 0,"calt" 0;transition:transform .5s var(--spring);transition-delay:calc(var(--i)*18ms)}
.idea-link[data-motion=doodle].active .idea-word{transform:rotate(-3deg) translateY(-2px)}
.idea-link[data-motion=doodle].active .letter{transform:translateY(-4px) rotate(-4deg)}
.idea-link[data-motion=doodle].active .letter:nth-child(even){transform:translateY(2px) rotate(5deg)}
.idea-link[data-motion=doodle].active .letter:nth-child(3n){transform:translateY(-7px) rotate(8deg)}
.idea-link[data-motion=wave].active .letter{animation:wave .9s ease-in-out infinite;animation-delay:calc(var(--i)*110ms)}
.idea-link[data-motion=jelly].active .letter{animation:jelly .75s both;animation-delay:calc(var(--i)*55ms)}
.idea-link[data-motion=hop].active .letter{animation:hop .5s cubic-bezier(.22,.75,.3,1) both;animation-delay:calc(var(--i)*70ms)}
.idea-link[data-motion=spread].active .idea-word{transform:rotate(-4deg)}
.idea-link[data-motion=spread].active .letter{transform:translateX(calc((var(--i) - 1.5)*3px)) rotate(calc((var(--i) - 1.5)*5deg))}
.idea-link[data-motion=wobble].active .letter{animation:wobble .36s ease-in-out infinite alternate;animation-delay:calc(var(--i)*-90ms)}
.idea-link[data-motion=wobble].active .letter:nth-child(even){animation-direction:alternate-reverse}
.idea-link[data-motion=grow].active .letter{animation:grow .55s var(--spring) both;animation-delay:calc(var(--i)*45ms)}
.idea-line{position:absolute;left:3px;right:3px;top:calc(100% - 3px);width:calc(100% - 6px);height:9px;overflow:visible;pointer-events:none}
.idea-line path{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.idea-line.flow path{stroke-dasharray:5 6;opacity:0;transition:opacity .25s}
.idea-line.beads path{stroke-dasharray:0 6;stroke-width:2.6}
.idea-link.active .idea-line.flow path{opacity:.9;animation:flow 3s linear infinite}
.idea-line.draw path{stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .5s cubic-bezier(.65,0,.35,1)}
.idea-link.active .idea-line.draw path{stroke-dashoffset:0}
.idea-line.drawdash path{stroke-dasharray:4 4;opacity:0;clip-path:inset(0 100% 0 0);transition:clip-path .5s cubic-bezier(.65,0,.35,1),opacity .1s}
.idea-link.active .idea-line.drawdash path{opacity:.9;clip-path:inset(0 0 0 0);animation:flow 3s linear infinite}
@keyframes flow{to{stroke-dashoffset:-66}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes jelly{0%{transform:scale(1,1)}25%{transform:scale(1.25,.72)}45%{transform:scale(.82,1.22) translateY(-3px)}65%{transform:scale(1.08,.94)}82%{transform:scale(.97,1.03)}100%{transform:scale(1,1)}}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-8px) rotate(-7deg)}70%{transform:translateY(1px) rotate(2deg)}}
@keyframes wobble{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes grow{0%{transform:scale(1)}50%{transform:scale(1.35) translateY(-2px)}100%{transform:scale(1.08)}}
body.embedded{min-height:0}
body.embedded .lab{padding:0;width:100%}
body.embedded .grid{display:block}
body.embedded .variant{display:none}
body.embedded .variant.embedded{display:block;border:0;border-radius:0;padding:0;box-shadow:none;min-height:200px}
body.embedded .stage{height:145px;border-bottom:0}
body.embedded .variant-copy{margin:0;padding:0 18px}
body.embedded .note{font-size:11px;padding:0 18px 16px}
body.embedded .replay{right:8px;top:7px}
body.embedded .lab-head,body.embedded .lede,body.embedded .status,body.embedded #motion-note{display:none}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:400px){.lab{padding:20px 16px 32px}.grid{grid-template-columns:1fr}.stage{height:90px}.lede{margin:16px 0 20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.idea-link.active .idea-line.flow path,.idea-link.active .idea-line.drawdash path{opacity:.9;clip-path:none}.idea-link.active .idea-line.draw path{stroke-dashoffset:0}}

.lab .grid{grid-template-columns:minmax(0,1fr)}
.lab .stage{height:220px}
body.embedded{background:var(--paper)}
body.embedded .variant.embedded{min-height:0}
body.embedded .stage{height:100vh}
body.embedded .variant-copy,body.embedded .note,body.embedded .replay{display:none}
</style></head>

<p class="lede">The word tilts and the letters fan apart. Hover, focus, or use Replay.</p>
<div class="grid"><article class="variant">
  <button class="variant-select" id="variant-spread" aria-pressed="true" aria-label="Preview Spread">
    <span class="stage"><span class="idea-link" data-motion="spread"><span class="idea-word" aria-label="Idea"></span></span></span>
    <span class="variant-copy"><span class="variant-name">Spread</span><span class="variant-number">05</span></span>
    <span class="note">The word tilts and the letters fan apart.</span>
  </button>
  <button class="replay" aria-label="Replay Spread" aria-controls="variant-spread" title="Replay Spread">↻</button>
</article></div>
<p class="status" id="status">Selected · <strong>Spread</strong></p>
<p class="note" id="motion-note">Replay restarts this treatment. Hover or focus to keep the preview active.</p>
</main><script>
const controls = [...document.querySelectorAll('.variant-select')];
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const timers = new WeakMap();
const active = (control, on) => control.querySelector('.idea-link').classList.toggle('active', on);
function prepare() {
  for (const control of controls) {
    control.querySelector('.idea-word').replaceChildren(...[...'Idea'].map((letter, index) => {
      const span = document.createElement('span');
      span.className = 'letter';
      span.style.setProperty('--i', index);
      span.textContent = letter;
      span.setAttribute('aria-hidden', 'true');
      return span;
    }));
  }
}
function select(control) {
  controls.forEach(item => {
    const selected = item === control;
    item.setAttribute('aria-pressed', String(selected));
    item.closest('.variant').classList.toggle('selected', selected);
  });
  document.querySelector('#status').innerHTML = `Selected · <strong>${control.querySelector('.variant-name').textContent}</strong>`;
}
function replay(control) {
  clearTimeout(timers.get(control));
  const previous = control.querySelector('.idea-link');
  const copy = previous.cloneNode(true);
  copy.classList.remove('active');
  previous.replaceWith(copy);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    copy.classList.add('active');
    timers.set(control, setTimeout(() => {
      if (document.activeElement !== control && !control.matches(':hover')) copy.classList.remove('active');
    }, reduced.matches ? 0 : 1700));
  }));
}
prepare();
select(controls[0]);
for (const control of controls) {
  control.addEventListener('pointerenter', () => { if (matchMedia('(hover:hover)').matches) active(control, true); });
  control.addEventListener('pointerleave', () => { if (matchMedia('(hover:hover)').matches) active(control, false); });
  control.addEventListener('focus', () => active(control, true));
  control.addEventListener('blur', () => active(control, false));
  control.addEventListener('click', () => { select(control); replay(control); });
}
for (const button of document.querySelectorAll('.replay')) {
  button.addEventListener('click', () => {
    const control = document.getElementById(button.getAttribute('aria-controls'));
    select(control);
    replay(control);
  });
  button.addEventListener('focus', () => active(document.getElementById(button.getAttribute('aria-controls')), true));
  button.addEventListener('blur', event => {
    const control = document.getElementById(button.getAttribute('aria-controls'));
    if (event.relatedTarget !== control) active(control, false);
  });
  button.addEventListener('pointerenter', () => {
    if (matchMedia('(hover:hover)').matches) active(document.getElementById(button.getAttribute('aria-controls')), true);
  });
  button.addEventListener('pointerleave', event => {
    const control = document.getElementById(button.getAttribute('aria-controls'));
    if (!control.matches(':hover')) active(control, false);
  });
}
const params = new URLSearchParams(location.search);
const requested = params.get('variant') || decodeURIComponent(location.hash.slice(1));
if (requested) {
  const control = document.getElementById(`variant-${requested}`);
  if (control) {
    select(control);
    if (params.has('variant')) {
      document.body.classList.add('embedded');
      control.closest('.variant').classList.add('embedded');
    } else control.scrollIntoView({block: 'nearest'});
  }
}
if (params.get('theme') === 'dark') document.body.classList.add('dark');
document.querySelector('#theme').addEventListener('click', () => document.body.classList.toggle('dark'));
if (reduced.matches) document.querySelector('#motion-note').textContent = 'Reduced motion is on: active previews show their final states without animation.';
</script></body></html>
